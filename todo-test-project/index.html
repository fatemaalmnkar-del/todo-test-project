<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo List (Server‑served)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, sans-serif;
      background: #f1f5f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 720px;
      width: 100%;
      background: white;
      border-radius: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.10);
      padding: 32px 28px;
    }
    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
    }
    h1 span { font-size: 28px; }
    .subhead {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 24px;
      border-left: 4px solid #818cf8;
      padding-left: 14px;
    }
    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 28px;
    }
    .add-form input {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      background: #f8fafc;
    }
    .add-form input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(129,140,248,0.20);
      background: white;
    }
    .add-form button {
      padding: 12px 24px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .add-form button:hover { background: #4338ca; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
      padding-bottom: 16px;
      border-bottom: 2px solid #f1f5f9;
    }
    .stats {
      font-size: 14px;
      color: #475569;
      background: #f1f5f9;
      padding: 4px 14px;
      border-radius: 40px;
      font-weight: 500;
    }
    .stats strong { color: #0f172a; }
    .filter-group {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .filter-group button {
      padding: 6px 16px;
      border: 2px solid transparent;
      border-radius: 40px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #f1f5f9;
      color: #475569;
      transition: all 0.2s;
    }
    .filter-group button:hover { background: #e2e8f0; }
    .filter-group button.active {
      background: #4f46e5;
      color: white;
      border-color: #4f46e5;
    }
    .filter-group button.danger {
      color: #ef4444;
      background: #fef2f2;
    }
    .filter-group button.danger:hover { background: #fee2e2; }
    .search-wrap {
      margin-bottom: 18px;
    }
    .search-wrap input {
      width: 100%;
      padding: 10px 16px;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
    }
    .search-wrap input:focus {
      border-color: #818cf8;
      box-shadow: 0 0 0 4px rgba(129,140,248,0.15);
      background: white;
    }
    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 420px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .todo-list::-webkit-scrollbar { width: 6px; }
    .todo-list::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
    .todo-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: #f8fafc;
      border-radius: 14px;
      border: 2px solid transparent;
      transition: background 0.2s;
    }
    .todo-item:hover { background: #f1f5f9; border-color: #e2e8f0; }
    .todo-item.completed .todo-title {
      text-decoration: line-through;
      color: #94a3b8;
    }
    .todo-item .todo-title {
      flex: 1;
      font-size: 15px;
      color: #0f172a;
      word-break: break-word;
    }
    .todo-item .todo-meta {
      font-size: 12px;
      color: #94a3b8;
      white-space: nowrap;
      margin-right: 4px;
    }
    .todo-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: #4f46e5;
      cursor: pointer;
      flex-shrink: 0;
    }
    .todo-item .delete-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: all 0.2s;
    }
    .todo-item .delete-btn:hover {
      color: #ef4444;
      background: #fef2f2;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #94a3b8;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 8px; }
    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f172a;
      color: white;
      padding: 12px 28px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s, transform 0.3s;
      pointer-events: none;
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    .toast.error { background: #dc2626; }
    .toast.success { background: #16a34a; }
    @media (max-width: 500px) {
      .container { padding: 20px 16px; }
      .add-form { flex-wrap: wrap; }
      .add-form button { width: 100%; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .filter-group { justify-content: center; }
      .todo-item .todo-meta { margin-left: 32px; font-size: 11px; }
    }
  </style>
</head>
<body>

<div class="container" id="app">
  <h1><span>✓</span> Tasks</h1>
  <div class="subhead">Manage your daily todos — data stored in memory.</div>

  <form class="add-form" id="addForm">
    <input type="text" id="titleInput" placeholder="What needs to be done?" autofocus />
    <button type="submit">Add Task</button>
  </form>

  <div class="toolbar">
    <span class="stats" id="stats">📊 <strong id="totalCount">0</strong> total</span>
    <div class="filter-group">
      <button class="active" data-filter="all">All</button>
      <button data-filter="pending">Pending</button>
      <button data-filter="completed">Done</button>
      <button class="danger" id="clearBtn">✕ Clear All</button>
    </div>
  </div>

  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍 Search todos…" />
  </div>

  <ul class="todo-list" id="todoList">
    <li class="empty-state">
      <div class="icon">📭</div>
      <p>No todos yet. Add one above!</p>
    </li>
  </ul>
</div>

<div class="toast" id="toast"></div>

<script>
  // ----------------------------------------------------------------
  //  1.  Load todo.js from the server and run it in a Node shim
  // ----------------------------------------------------------------

  async function loadTodoModule() {
    const response = await fetch('/todo.js');
    const code = await response.text();

    // Create a fresh module context
    const module = { exports: {} };
    const exports = module.exports;

    // Evaluate the code in this context (with module and exports available)
    const fn = new Function('module', 'exports', code);
    fn(module, exports);

    // The exported value is what todo.js assigned to module.exports
    return module.exports;
  }

  // ----------------------------------------------------------------
  //  2.  Start the app once the module is loaded
  // ----------------------------------------------------------------

  loadTodoModule().then(todoApp => {
    // ---- todoApp is now the exact `todolist` object from your todo.js ----

    // DOM refs
    const form = document.getElementById('addForm');
    const titleInput = document.getElementById('titleInput');
    const todoListEl = document.getElementById('todoList');
    const statsEl = document.getElementById('stats');
    const totalCountEl = document.getElementById('totalCount');
    const searchInput = document.getElementById('searchInput');
    const clearBtn = document.getElementById('clearBtn');

    // State
    let currentFilter = 'all';
    let searchQuery = '';

    // Toast
    let toastTimer = null;
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = 'toast ' + type;
      void toast.offsetWidth;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }
    function showError(msg) { showToast('⚠ ' + msg, 'error'); }
    function showSuccess(msg) { showToast('✓ ' + msg, 'success'); }

    // Escape HTML
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Render
    function render() {
      let items = todoApp.getTodos();

      if (searchQuery.trim() !== '') {
        items = todoApp.searchTodos(searchQuery.trim());
      }

      if (currentFilter === 'pending') {
        items = items.filter(t => !t.completed);
      } else if (currentFilter === 'completed') {
        items = items.filter(t => t.completed);
      }

      const all = todoApp.getTodos();
      const total = all.length;
      const done = all.filter(t => t.completed).length;
      const pending = total - done;
      totalCountEl.textContent = total;
      statsEl.innerHTML = `📊 <strong>${total}</strong> total · <strong>${done}</strong> done · <strong>${pending}</strong> pending`;

      if (items.length === 0) {
        todoListEl.innerHTML = `
          <li class="empty-state">
            <div class="icon">📭</div>
            <p>${searchQuery.trim() ? 'No matching todos.' : 'No todos yet. Add one above!'}</p>
          </li>
        `;
        return;
      }

      let html = '';
      for (const todo of items) {
        const checked = todo.completed ? 'checked' : '';
        const completedClass = todo.completed ? 'completed' : '';
        html += `
          <li class="todo-item ${completedClass}" data-id="${todo.id}">
            <input type="checkbox" class="toggle-check" ${checked} />
            <span class="todo-title">${escapeHtml(todo.title)}</span>
            <span class="todo-meta">${todo.createdAt}</span>
            <button class="delete-btn" title="Delete task">✕</button>
          </li>
        `;
      }
      todoListEl.innerHTML = html;

      document.querySelectorAll('.filter-group button[data-filter]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === currentFilter);
      });
    }

    // --- Event listeners ---

    // Add
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const raw = titleInput.value;
      try {
        const added = todoApp.addTodo(raw);
        showSuccess(`Added "${added.title}"`);
        titleInput.value = '';
        titleInput.focus();
        render();
      } catch (err) {
        showError(err.message);
      }
    });

    // Toggle / Delete (delegation)
    todoListEl.addEventListener('click', (e) => {
      const item = e.target.closest('.todo-item');
      if (!item) return;
      const id = Number(item.dataset.id);

      if (e.target.classList.contains('toggle-check')) {
        try {
          const updated = todoApp.toggleComplete(id);
          showSuccess(updated.completed ? 'Marked as done' : 'Marked as pending');
          render();
        } catch (err) {
          showError(err.message);
        }
        return;
      }

      if (e.target.classList.contains('delete-btn')) {
        try {
          todoApp.removeTodo(id);
          showSuccess('Task deleted');
          render();
        } catch (err) {
          showError(err.message);
        }
        return;
      }

      // Click on the item itself (toggle)
      try {
        const updated = todoApp.toggleComplete(id);
        showSuccess(updated.completed ? 'Marked as done' : 'Marked as pending');
        render();
      } catch (err) {
        showError(err.message);
      }
    });

    // Filter buttons
    document.querySelectorAll('.filter-group button[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => {
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    // Clear all
    clearBtn.addEventListener('click', () => {
      if (todoApp.getTodos().length === 0) {
        showToast('Already empty', 'error');
        return;
      }
      if (confirm('Delete all todos?')) {
        const count = todoApp.clearAll();
        showSuccess(`Cleared ${count} task${count !== 1 ? 's' : ''}`);
        render();
      }
    });

    // Search
    searchInput.addEventListener('input', () => {
      searchQuery = searchInput.value;
      render();
    });

    // Prevent form submit on Enter in search
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') e.preventDefault();
    });

    // Initial render
    render();
    titleInput.focus();

    console.log('✅ Todo app running with your exact todo.js (no changes)');
    console.log('📦 Exported object:', todoApp);

  }).catch(err => {
    console.error('Failed to load todo.js:', err);
    document.body.innerHTML = `<h1>Error loading todo.js</h1><pre>${err.message}</pre>`;
  });
</script>

</body>
</html>
